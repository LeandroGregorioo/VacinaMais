<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/loginstyle.css">
    <title>VacinaMais</title>
</head>
<body>

    <!--Cabeçalho-->
    <header class="containerHeader">
        <img class="logoHeader" src="../image/logo.svg" alt="Logo do sistema VacinaMais">
    </header>
    <br>

    <!--Conteudo da pagina-->
    <main class="containerLogin">

        <section class="caixaLogin">
            <h1>Bem-Vindo!</h1>
            <p>Consulte sua carteira de vacinação</p>
            <br>
        <form id="loginForm">
    <input 
        class="cpf" 
        type="text" 
        id="cpf" 
        placeholder="Insira seu CPF" 
        maxlength="14" 
        inputmode="numeric" 
        autocomplete="off"
    >

    <button type="submit">Acessar</button>
</form>

        </section>

    </main>
     <script src="../script/login.js"></script>
</body>
</html>
