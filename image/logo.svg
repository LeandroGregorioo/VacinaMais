<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%" role="img" aria-label="Logo VACINA +">
  <defs>
    <!-- Sombra suave para destaque do ícone sobre o fundo do cabeçalho -->
    <filter id="sombra-icone" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ÍCONE: Escudo de Proteção (Branco) com Cruz + (Vermelho) -->
  <g transform="translate(10, 10)" filter="url(#sombra-icone)">
    <!-- Escudo Branco -->
    <path d="M40 5 C55 5 70 12 70 20 V48 C70 66 40 76 40 76 C40 76 10 66 10 48 V20 C10 12 25 5 40 5 Z" fill="#FFFFFF" />
    
    <!-- Sinal + em Vermelho Alerta -->
    <path d="M34 26 H46 V34 H54 V46 H46 V54 H34 V46 H26 V34 H34 Z" fill="#FF6B6B" />
    
    <!-- Detalhe em Ciano Claro -->
    <circle cx="53" cy="23" r="4" fill="#4ECDC4" />
  </g>

  <!-- TIPOGRAFIA: VACINA + em Caixa Alta -->
  <g transform="translate(95, 56)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" letter-spacing="1">
      VACINA <tspan fill="#FF6B6B" font-weight="900">+</tspan>
    </text>
  </g>

  <!-- SUBTÍTULO / TAGLINE -->
  <g transform="translate(97, 78)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="11" fill="#FFFFFF" opacity="0.88" letter-spacing="3.5">
      SAÚDE &amp; PROTEÇÃO
    </text>
  </g>
</svg>
