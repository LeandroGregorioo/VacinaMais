<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Arquivos CSS-->  
    <link rel="stylesheet" href="../css/homestyle.css">
    <link rel="stylesheet" href="../css/ai_assistent_style.css">
    <link rel="stylesheet" href="../css/carrossel.css">
    <!--icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <title>VacinaMais</title>
</head>
<body>

    <!--Cabeçalho-->
    <header class="containerHeader">
        <img class="logoHeader" src="../image/logo.svg" alt="Logo do sistema VacinaMais">
    </header>
   <br>
   <!-- Carrosel com imagens de propagandas da saude-->
   <section class="carrossel">
       <input type="radio" name="radio-bnt" id="radio1">
       <input type="radio" name="radio-bnt" id="radio2">
       <input type="radio" name="radio-bnt" id="radio3">
       <div class="slides">
            <div class="slide first">
                <img src="../image/carrossel/ministério-da-saúde.png" class="img_carrossel" >
            </div>
            <div class="slide">
                <img src="../image/carrossel/Peca-Joilma-Oliveira-Campanha-MS-.webp" class="img_carrossel" >
            </div>
            <div class="slide">
                <img src="../image/carrossel/unnamed-1.jpg" class="img_carrossel">
            </div>
        </div>
        <div class="navigation">
            <label for="radio1" class="navigation-btn"></label>
            <label for="radio2" class="navigation-btn"></label>
            <label for="radio3" class="navigation-btn"></label>
        </div>
   </section>
    <!--Conteudo-->
    <main class="containerMain">

        <!-- COLUNA DA ESQUERDA (Bem-vindo + Formulário) -->
        <div class="coluna-esquerda">
            
            <section class="userInfo">
                <h1>Bem-Vindo João!</h1>
                <p>A sua carteira de vacinação</p>
            </section>
            
            <section class="adicionar-vacina">
                <h2>Registrar Nova Vacina</h2>
                <form>
                    <input type="text" id="nome-vacina" placeholder="Nome da Vacina (Ex: Tétano)">
                    <input type="date" id="data-vacina">
                    <select id="status-vacina">
                        <option value="Em dia">Em dia</option>
                        <option value="Atrasada">Atrasada</option>
                        <option value="Reforço pendente">Reforço pendente</option>
                    </select>
                    <button type="button" onclick="adicionarVacina()">Salvar Vacina</button>
                </form>
            </section>

        </div>

        <!-- COLUNA DA DIREITA (Lista de vacinas) -->
        <div class="coluna-direita">
            <section class="minhasVacinas">
                <h2>Minha Carteira</h2>
                <div id="listadeVacinas"></div>
            </section>
        </div>

    </main>

    <footer class="footer">

    </footer>

    <!--Assistente de AI-->
    <section class="ai-assist">
        <button id="on-ai" value="1" onclick="aiContainer()">
            <span class="material-symbols-outlined">robot_2</span>
        </button> 
        <section class="container-ai">
            <div class="header-ai" >
                <div class="perfil-ai">
                    <div class="avatar-ai">
                        <img src="../image/robo.jpg" alt="Avatar da IA">
                    </div>
                    <div class="info-ai">
                        <h4>Assistente VacinaMais</h4>
                        <span class="status-online">
                            <span class="bolinha-verde"></span> Online
                        </span>
                    </div>
                </div>
                <button id="off-ai" onclick="aiContainer()">
                    <span class="material-symbols-outlined">close_small</span>
                </button>
                
            </div>
            <div class="content-ai"></div>
            <div class="send-text-ai">
                <textarea name="" id=""></textarea>
                <button class=""><span class="material-symbols-outlined">send</span></button>
            </div>
        </section>
    </section>

    <!--Arquivos Javascript-->
    <script src="../script/script.js"></script>
    <script src="../script/ai-button.js"></script>
    <script src="../script/carrossel.js"></script>
</body>
</html>
